name: Cold Carti — Daily Stats

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - '.github/workflows/collect-stats.yml'

permissions:
  contents: write

concurrency:
  group: collect-cold-carti
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser support
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Install OCR for Yandex screenshot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus

      - name: Collect public statistics
        env:
          YANDEX_PROXY_URL: ${{ secrets.YANDEX_PROXY_URL }}
        run: python scripts/collect.py

      - name: Upload Yandex screenshot for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-page-screenshot
          path: diagnostics/yandex-latest.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save history and source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Cold Carti statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
