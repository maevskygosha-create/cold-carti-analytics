name: Cold Carti — Daily Stats

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - '.github/workflows/collect-stats.yml'

permissions:
  contents: write

concurrency:
  group: collect-cold-carti
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser support
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Install OCR for Yandex screenshot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus

      - name: Collect Telegram and TikTok without VPN
        run: python scripts/collect.py --only telegram,tiktok

      - name: Connect BlancVPN Kazakhstan WireGuard for Yandex
        id: blancvpn
        env:
          BLANCVPN_WG_CONFIG: ${{ secrets.BLANCVPN_KZ_WG_CONFIG }}
        run: |
          if [ -z "$BLANCVPN_WG_CONFIG" ]; then
            echo "No Kazakhstan configuration: add BLANCVPN_KZ_WG_CONFIG in GitHub Actions secrets"
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Kazakhstan secret received; testing WireGuard access (credentials hidden)"
          sudo apt-get install -y -qq wireguard-tools
          sudo install -m 600 /dev/null /etc/wireguard/coldcarti.conf
          printf '%s\n' "$BLANCVPN_WG_CONFIG" | sudo tee /etc/wireguard/coldcarti.conf >/dev/null
          sudo sed -i '/^[[:space:]]*DNS[[:space:]]*=/d' /etc/wireguard/coldcarti.conf
          if ! sudo wg-quick up coldcarti; then
            echo "WireGuard connection failed"
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Testing IPv4 connectivity through WireGuard"
          EXIT_COUNTRY="$(curl -4 -fsS --connect-timeout 5 --max-time 12 https://ipinfo.io/country 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$EXIT_COUNTRY" != "KZ" ]; then
            ALT_COUNTRY="$(curl -4 -fsS --connect-timeout 5 --max-time 12 https://ifconfig.co/country-iso 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$ALT_COUNTRY" = "KZ" ]; then
              EXIT_COUNTRY="$ALT_COUNTRY"
            fi
          fi
          LAST_HANDSHAKE="$(sudo wg show coldcarti latest-handshakes | awk '{print $2}' | head -1)"
          RX_TX="$(sudo wg show coldcarti transfer | awk '{print $2 " received / " $3 " sent"}' | head -1)"
          echo "WireGuard handshake: $([ "${LAST_HANDSHAKE:-0}" -gt 0 ] && echo connected || echo missing)"
          echo "WireGuard traffic: ${RX_TX:-unknown}"
          echo "VPN egress country: ${EXIT_COUNTRY:-unknown}"
          if [ "$EXIT_COUNTRY" = "KZ" ]; then
            echo "Kazakhstan exit confirmed"
            echo "active=true" >> "$GITHUB_OUTPUT"
          elif [ "${LAST_HANDSHAKE:-0}" -gt 0 ]; then
            echo "Tunnel handshook but Kazakhstan geo lookup failed; cannot confirm KZ exit"
            sudo wg-quick down coldcarti || true
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "No WireGuard handshake: disconnecting nonfunctional tunnel"
            sudo wg-quick down coldcarti || true
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect Yandex Music from Kazakhstan
        if: steps.blancvpn.outputs.active == 'true'
        run: python scripts/collect.py --only yandex

      - name: Disconnect BlancVPN before saving data
        if: always()
        run: |
          if sudo test -e /etc/wireguard/coldcarti.conf; then
            sudo wg-quick down coldcarti || true
            sudo rm -f /etc/wireguard/coldcarti.conf
          fi

      - name: Upload Yandex screenshot for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-page-screenshot
          path: diagnostics/yandex-latest.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save history and source status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Cold Carti statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
