name: Cold Carti — Daily Stats

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-cold-carti
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser support
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Collect public statistics
        run: python scripts/collect.py

      - name: Save history and source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Cold Carti statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
