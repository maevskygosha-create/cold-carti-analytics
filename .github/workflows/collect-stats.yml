name: Cold Carti — Daily Stats

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - '.github/workflows/collect-stats.yml'

permissions:
  contents: write

concurrency:
  group: collect-cold-carti
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser support
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Install OCR for Yandex screenshot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus

      - name: Collect Telegram, Instagram and TikTok without VPN
        run: python scripts/collect.py --only telegram,instagram,tiktok

      - name: Connect BlancVPN WireGuard for Yandex
        id: blancvpn
        env:
          BLANCVPN_WG_CONFIG: ${{ secrets.BLANCVPN_WG_CONFIG }}
        run: |
          if [ -z "$BLANCVPN_WG_CONFIG" ]; then
            echo "No BlancVPN configuration: add BLANCVPN_WG_CONFIG in GitHub Actions secrets"
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "BlancVPN config detected; connecting WireGuard (secret hidden)"
          sudo apt-get install -y -qq wireguard-tools
          sudo install -m 600 /dev/null /etc/wireguard/coldcarti.conf
          printf '%s\n' "$BLANCVPN_WG_CONFIG" | sudo tee /etc/wireguard/coldcarti.conf >/dev/null
          sudo sed -i '/^[[:space:]]*DNS[[:space:]]*=/d' /etc/wireguard/coldcarti.conf
          if ! sudo wg-quick up coldcarti; then
            echo "WireGuard connection failed"
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXIT_COUNTRY="$(curl -fsS --max-time 20 https://ipinfo.io/country | tr -d '[:space:]' || true)"
          echo "VPN egress country: ${EXIT_COUNTRY:-unknown}"
          if [ "$EXIT_COUNTRY" != "RU" ] && [ "$EXIT_COUNTRY" != "KZ" ]; then
            echo "VPN exit is not RU/KZ; disconnecting, do not treat as regional connection."
            sudo wg-quick down coldcarti || true
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect Yandex Music from regional VPN
        if: always()
        env:
          YANDEX_PROXY_URL: ${{ secrets.YANDEX_PROXY_URL }}
        run: |
          if [ "${{ steps.blancvpn.outputs.active }}" != "true" ] && [ -z "$YANDEX_PROXY_URL" ]; then
            echo "Regional VPN not connected; Yandex may return HTTP 451"
          fi
          python scripts/collect.py --only yandex

      - name: Disconnect BlancVPN before saving data
        if: always()
        run: |
          if sudo test -e /etc/wireguard/coldcarti.conf; then
            sudo wg-quick down coldcarti || true
            sudo rm -f /etc/wireguard/coldcarti.conf
          fi

      - name: Upload Yandex screenshot for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-page-screenshot
          path: diagnostics/yandex-latest.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Save history and source status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Cold Carti statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
