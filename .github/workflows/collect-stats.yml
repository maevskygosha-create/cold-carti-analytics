
name: Cold Carti — Daily Stats

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-cold-carti
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect all available statistics
        run: python scripts/collect.py

      - name: Save metrics and diagnostic status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Cold Carti public stats"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
